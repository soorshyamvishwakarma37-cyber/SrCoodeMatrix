<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart & Checkout — SR CodeMatrix Pvt Ltd</title>
  <meta name="description" content="Secure checkout powered by Razorpay — UPI, cards and netbanking.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50' y='64' font-size='42' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SR</text></svg>">
</head>
<body data-page="cart">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Your <span class="grad-txt">Cart</span></h1>
        <p>Try a coupon: <strong>SR10</strong> (10% off), <strong>WELCOME50</strong> (₹50 off) or <strong>FREESHIP</strong> (₹30 off). Pro members also get <strong>PRO10</strong>.</p>
      </div>
    </section>

    <div class="container" id="cart-content">
      <div class="empty-state"><span>⏳</span><h3>Loading your cart…</h3></div>
    </div>

    <div class="container">
      <div class="ad-slot" data-format="horizontal" data-slot="home_banner"></div>
      <div style="height:20px"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="store.js"></script>
  <script src="main.js"></script>
</body>
</html>

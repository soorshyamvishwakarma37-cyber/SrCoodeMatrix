<!--
================================================================================
 SR CODEMATRIX — 3 FILES ME POORA WEBSITE
================================================================================
   index.html   → poora website (8 pages + admin panel)
   style.css    → saara design / CSS
   script.js    → saara JavaScript + saara data

 Teeno files ek hi folder me rakho aur index.html kholo — chalu ho jayega.
 Hosting par upload karne ke liye teeno files ek saath daal do.

 ---------------------------------------------------------------------------
 DATA KAISE BADLEIN?  (script.js kholo)
 --------------------------------------------------------------------------
 Sabse upar "const DATA = {" dhoondo — usi ke andar sab kuch hai:
   brand.email, brand.phone, brand.whatsapp, brand.address ...
   templates: [...]        → store ke templates
   calculator.types[].p    → order ki rates
   plans[].price           → pricing
   faqs, testimonials, stats, incomeSources ...

 YA phir sabse aasan tareeka:
   Site kholo → #admin → 24 sections me sab edit karo → "Save & Publish"

 GOOGLE LOGIN : script.js me  GOOGLE_CLIENT_ID : "....apps.googleusercontent.com",
 ADMIN PIN    : script.js me  ADMIN_PIN         : "7391",

 ---------------------------------------------------------------------------
 PAGES (hash router):  #index  #store  #earnings  #order  #features
                       #login  #dashboard  #admin
================================================================================
-->

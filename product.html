<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — SR CodeMatrix Pvt Ltd</title>
  <meta name="description" content="Product details — secure Razorpay checkout, instant delivery, GST invoice.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50' y='64' font-size='42' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SR</text></svg>">
</head>
<body data-page="product">

  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="pd-layout" id="product-root">
        <div class="empty-state"><span>⏳</span><h3>Loading product…</h3></div>
      </div>

      <div class="ad-slot" data-format="auto" data-slot="sidebar"></div>

      <!-- RATINGS & REVIEWS -->
      <section class="section" id="reviews-root" style="padding-top:30px">
        <div class="section-head" style="text-align:left;margin-left:0">
          <span class="kicker">Ratings &amp; Reviews</span>
          <h2 style="font-size:1.5rem">What buyers say</h2>
        </div>
        <p class="muted">Loading reviews…</p>
      </section>

      <section class="section" style="padding-top:30px">
        <div class="section-head" style="text-align:left;margin-left:0">
          <span class="kicker">Related</span>
          <h2 style="font-size:1.5rem">Isi category ke products</h2>
        </div>
        <div class="grid-4" id="related-grid"></div>
        <div style="height:36px"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="store.js"></script>
  <script src="main.js"></script>
</body>
</html>

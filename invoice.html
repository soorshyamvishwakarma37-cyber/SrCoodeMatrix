<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax Invoice — SR CodeMatrix Pvt Ltd</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50' y='64' font-size='42' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SR</text></svg>">
  <style>
    :root { --ink: #0f172a; --line: #cbd5e1; --muted: #64748b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: #e2e8f0; color: var(--ink); padding: 28px 14px 60px; }
    .inv-toolbar { max-width: 860px; margin: 0 auto 16px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
    .inv-toolbar a, .inv-toolbar button {
      border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 9px;
      padding: 10px 18px; font-size: .92rem; font-weight: 650; cursor: pointer; text-decoration: none;
    }
    .inv-toolbar .ghost { background: #fff; color: #0f172a; }
    .paper {
      max-width: 860px; margin: 0 auto; background: #fff; padding: 40px 44px 32px;
      box-shadow: 0 18px 50px rgba(0,0,0,.18); border-radius: 4px;
    }
    .inv-top { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid var(--ink); padding-bottom: 16px; }
    .brand-line { display: flex; gap: 12px; align-items: center; }
    .brand-mark { width: 46px; height: 46px; border-radius: 10px; background: linear-gradient(135deg,#6366f1,#22d3ee); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: .9rem; }
    .brand-line h1 { font-size: 1.15rem; letter-spacing: -.01em; }
    .brand-line .sub { font-size: .8rem; color: var(--muted); }
    .inv-title { text-align: right; }
    .inv-title h2 { font-size: 1.5rem; letter-spacing: .12em; text-transform: uppercase; }
    .inv-title .no { font-family: Consolas, monospace; font-size: .95rem; font-weight: 700; margin-top: 4px; }
    .inv-title .date { font-size: .82rem; color: var(--muted); }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 20px 0; }
    .party { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: .86rem; line-height: 1.55; }
    .party .lbl { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: 6px; }
    .party strong { font-size: .95rem; }
    table.items { width: 100%; border-collapse: collapse; font-size: .86rem; margin-top: 6px; }
    table.items th { background: #f1f5f9; text-align: left; padding: 10px 12px; border: 1px solid var(--line); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    table.items td { padding: 11px 12px; border: 1px solid var(--line); vertical-align: top; }
    table.items .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .summary { display: grid; grid-template-columns: 1fr 300px; gap: 18px; margin-top: 18px; }
    .notes { font-size: .78rem; color: var(--muted); line-height: 1.6; }
    .totals { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .totals .row { display: flex; justify-content: space-between; padding: 9px 14px; font-size: .88rem; border-bottom: 1px solid #e2e8f0; }
    .totals .row:last-child { border-bottom: 0; }
    .totals .grand { background: #0f172a; color: #fff; font-weight: 800; font-size: 1rem; }
    .sign-row { display: flex; justify-content: space-between; margin-top: 44px; font-size: .8rem; color: var(--muted); }
    .sign-box { text-align: center; min-width: 180px; }
    .sign-box .line { border-top: 1px solid var(--ink); margin-top: 38px; padding-top: 6px; color: var(--ink); font-weight: 650; }
    .computer-generated { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 26px; letter-spacing: .06em; text-transform: uppercase; }
    .err { max-width: 560px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 12px; text-align: center; }
    .err h2 { margin-bottom: 10px; }
    .err p { color: var(--muted); font-size: .92rem; margin-bottom: 18px; }
    .err a { display: inline-block; background: #6366f1; color: #fff; padding: 11px 22px; border-radius: 10px; text-decoration: none; font-weight: 650; }
    @media print {
      body { background: #fff; padding: 0; }
      .inv-toolbar { display: none !important; }
      .paper { box-shadow: none; max-width: 100%; padding: 10mm; }
      @page { size: A4; margin: 10mm; }
    }
    @media (max-width: 640px) {
      .parties, .summary { grid-template-columns: 1fr; }
      .paper { padding: 22px 16px; }
      .inv-top { flex-direction: column; }
      .inv-title { text-align: left; }
      table.items { font-size: .76rem; }
    }
  </style>
</head>
<body>
  <div class="inv-toolbar">
    <a class="ghost" href="#" onclick="history.length>1?history.back():location.href='index.html';return false;">← Back</a>
    <button onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>

  <div id="inv-root">
    <div class="err">
      <h2>Loading invoice…</h2>
      <p>Please wait.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="store.js"></script>
  <script>
    (async function () {
      const CFG = window.SR_CONFIG;
      const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmt = n => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const id = new URLSearchParams(location.search).get("id");
      const root = document.getElementById("inv-root");

      if (!id) { renderErr("Missing order ID.", "invoice.html?id=SRXXXXXXX"); return; }

      let order = null;
      try {
        const snap = sessionStorage.getItem("sr_inv_" + id);
        if (snap) order = JSON.parse(snap);
      } catch (e) {}

      try {
        await Store.init();
        if (!order) order = await Store.getOrder(id);
      } catch (e) {}

      if (!order) {
        renderErr("Invoice not found for order <strong>" + esc(id) + "</strong>.<br>Sign in from the device where you placed the order, or email " + esc(CFG.SUPPORT_EMAIL) + ".", "index.html");
        return;
      }

      const tax = order.tax && order.tax.rate != null ? order.tax : { rate: 0, taxable: order.total, cgst: 0, sgst: 0, igst: 0, intra: true };
      const cfg = await Store.taxConfig();
      const settings = await Store.getSettings();
      const company = settings.company_legal || CFG.BRAND;
      const gstin = settings.gstin || "—";
      const stateCode = settings.state_code || "23";
      const stateName = settings.state_name || "Madhya Pradesh";
      const invoiceNo = order.invoice_no || Store.invoiceNo(order.id);
      const buyer = order.buyer || order.customer || {};
      const buyerStateName = buyer.state_name || (STATES_NAME()[buyer.state] || "—");
      const date = new Date(order.date);
      const items = [
        ...(order.items || []).map(i => ({ name: i.title, qty: i.qty, rate: i.price, amount: i.price * i.qty })),
        ...(order.addons || []).map(a => ({ name: a.label, qty: 1, rate: a.price, amount: a.price }))
      ];

      function STATES_NAME() { return {}; }

      root.innerHTML = `
      <div class="paper">
        <div class="inv-top">
          <div class="brand-line">
            <div class="brand-mark">SR</div>
            <div>
              <h1>${esc(company)}</h1>
              <div class="sub">${esc(settings.address || CFG.ADDRESS)}</div>
              <div class="sub">☎ ${esc(settings.support_phone || CFG.SUPPORT_PHONE)} · ✉ ${esc(settings.support_email || CFG.SUPPORT_EMAIL)}</div>
              <div class="sub">GSTIN: <strong>${esc(gstin)}</strong> · State Code: ${esc(stateCode)}</div>
            </div>
          </div>
          <div class="inv-title">
            <h2>Tax Invoice</h2>
            <div class="no">${esc(invoiceNo)}</div>
            <div class="date">Invoice Date: ${date.toLocaleDateString("en-IN")}</div>
            <div class="date">Order: ${esc(order.id)} · Payment: ${esc(order.paymentId || "—")}</div>
          </div>
        </div>

        <div class="parties">
          <div class="party">
            <div class="lbl">Bill To (Supplier)</div>
            <strong>${esc(company)}</strong><br>
            ${esc(settings.address || CFG.ADDRESS)}<br>
            GSTIN: ${esc(gstin)}<br>
            Place of Supply: ${esc(stateName)} (${esc(stateCode)})
          </div>
          <div class="party">
            <div class="lbl">Bill To (Recipient)</div>
            <strong>${esc(buyer.name || "—")}</strong><br>
            ${esc(buyer.email || "")}${buyer.phone ? "<br>" + esc(buyer.phone) : ""}<br>
            State: ${esc(buyerStateName)}${buyer.state ? " (" + esc(buyer.state) + ")" : ""}<br>
            Buyer GSTIN: ${esc(buyer.gstin || "Unregistered / B2C")}
          </div>
        </div>

        <table class="items">
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Description of Services</th>
              <th>SAC</th>
              <th class="num">Qty</th>
              <th class="num">Rate (incl. GST)</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((it, i) => `
              <tr>
                <td>${i + 1}</td>
                <td>${esc(it.name)}</td>
                <td>${esc(cfg.sac_code)}</td>
                <td class="num">${it.qty}</td>
                <td class="num">${fmt(it.rate)}</td>
                <td class="num">${fmt(it.amount)}</td>
              </tr>`).join("")}
          </tbody>
        </table>

        <div class="summary">
          <div class="notes">
            <strong>Notes</strong><br>
            • Digital goods / services — delivery made electronically to ${esc(buyer.email || "the registered email")}.<br>
            • Prices are shown inclusive of GST. Taxable value and tax split below.<br>
            • ${tax.intra ? "Intra-state supply — CGST &amp; SGST charged." : "Inter-state supply — IGST charged."}
            ${order.coupon ? "<br>• Coupon applied: " + esc(order.coupon) + "." : ""}
            <br>• Payment gateway: Razorpay · Mode: ${order.offline ? "Offline/Manual" : "Online"}.
            <br><br>
            <strong>Terms:</strong> Subject to ${esc(CFG.BRAND_SHORT)} Terms &amp; Refund Policy. This invoice is computer-generated and valid without signature.
          </div>
          <div class="totals">
            <div class="row"><span>Taxable Value</span><strong>${fmt(tax.taxable)}</strong></div>
            ${tax.intra ? `
              <div class="row"><span>CGST @ ${(tax.rate / 2).toFixed(2)}%</span><strong>${fmt(tax.cgst)}</strong></div>
              <div class="row"><span>SGST @ ${(tax.rate / 2).toFixed(2)}%</span><strong>${fmt(tax.sgst)}</strong></div>
            ` : `
              <div class="row"><span>IGST @ ${tax.rate}%</span><strong>${fmt(tax.igst)}</strong></div>
            `}
            ${order.discount ? `<div class="row"><span>Coupon discount</span><strong>−${fmt(order.discount)}</strong></div>` : ""}
            <div class="row grand"><span>Grand Total</span><span>${fmt(order.total)}</span></div>
          </div>
        </div>

        <div class="sign-row">
          <div class="notes">Supply Place: ${esc(stateName)} (${esc(stateCode)})<br>Reverse Charge: No</div>
          <div class="sign-box">
            <div class="line">For ${esc(company)}</div>
            <div>Authorised Signatory</div>
          </div>
        </div>
        <div class="computer-generated">This is a computer-generated tax invoice · @ ${new Date().getFullYear()} ${esc(CFG.BRAND)}</div>
      </div>`;

      function renderErr(msg, href) {
        root.innerHTML = `<div class="err"><h2>🧾 Invoice unavailable</h2><p>${msg}</p><a href="${href}">Go back</a></div>`;
      }
    })();

    function renderErr(msg, href) {
      document.getElementById("inv-root").innerHTML =
        `<div class="err"><h2>🧾 Invoice unavailable</h2><p>${msg}</p><a href="${href}">Go back</a></div>`;
    }
  </script>
</body>
</html>
